# Tiny Tapeout project information
project:
  title:        "NeurAcc — Neural Network MAC Accelerator"
  author:       "Aarush"
  discord:      ""
  description:  "4-element weight-stationary systolic MAC array. Loads 4-bit weights serially, computes 8x4-bit multiply-accumulate steps in parallel, and reads out 12-bit results serially."
  language:     "Verilog"
  clock_hz:     10000000

  # How many tiles your design occupies?
  tiles: "1x1"

  # Your top module name must start with "tt_um_".
  top_module:  "tt_um_neuracc"

  # List your project's source files here.
  source_files:
    - "project.v"
    - "mac_array.v"
    - "mac_unit.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Inputs
  ui[0]: "serial_in — weight bit (shift in during LOAD_W state)"
  ui[1]: "load_weights — pulse high to start loading 32 weight bits"
  ui[2]: "compute — pulse high to do one MAC step (data on uio_in)"
  ui[3]: "read_out — pulse high to start serialising results"
  ui[4]: "clear_accum — pulse high to reset all accumulators"
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "serial_out — result bit (MSB-first, 64 bits total)"
  uo[1]: "ready — high when FSM is in IDLE state"
  uo[2]: ""
  uo[3]: ""
  uo[4]: ""
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""

  # Bidirectional pins
  uio[0]: "data_in[0] — 8-bit MAC input (LSB)"
  uio[1]: "data_in[1]"
  uio[2]: "data_in[2]"
  uio[3]: "data_in[3]"
  uio[4]: "data_in[4]"
  uio[5]: "data_in[5]"
  uio[6]: "data_in[6]"
  uio[7]: "data_in[7] — 8-bit MAC input (MSB)"

# Do not change!
yaml_version: 6

# Tiny Tapeout project info
# https://tinytapeout.com

--- 
# The top module name of your design
top_module: tt_um_sound_to_light

# Project title and author
project:
  title:   "Sound-to-Light Rhythm Visualizer with Spike Filter"
  author:  "TT Student"
  description: >
    A compact digital hardware system that converts a 6-bit audio envelope
    level into a rhythm-synchronized 6-LED bar-graph display. A digital spike
    filter (shift register + comparator + MUX) removes noise transients before
    driving the LED decoder. Entire design fits within ~700-900 logic gates.
  language: "Verilog"
  clock_hz: 100000         # 100 kHz nominal (10 us period)

# Tile size (1x1 is the smallest)
tiles: "1x1"

# Pin descriptions
pinout:
  # Inputs
  ui[0]: "Audio level bit 0 (LSB) from envelope comparator"
  ui[1]: "Audio level bit 1"
  ui[2]: "Audio level bit 2"
  ui[3]: "Audio level bit 3"
  ui[4]: "Audio level bit 4"
  ui[5]: "Audio level bit 5 (MSB) — 6-bit level, range 0-63"
  ui[6]: "Spike filter bypass (1=raw passthrough, 0=filtered)"
  ui[7]: "Unused (tie LOW)"

  # Outputs
  uo[0]: "LED 0 — lights at level >= 1  (~0% threshold)"
  uo[1]: "LED 1 — lights at level >= 11 (~17% threshold)"
  uo[2]: "LED 2 — lights at level >= 21 (~33% threshold)"
  uo[3]: "LED 3 — lights at level >= 32 (~50% threshold)"
  uo[4]: "LED 4 — lights at level >= 42 (~66% threshold)"
  uo[5]: "LED 5 — lights at level >= 52 (~82% threshold)"
  uo[6]: "Unused (always 0)"
  uo[7]: "Unused (always 0)"

  # Bidirectional (all unused)
  uio[0]: "Unused"
  uio[1]: "Unused"
  uio[2]: "Unused"
  uio[3]: "Unused"
  uio[4]: "Unused"
  uio[5]: "Unused"
  uio[6]: "Unused"
  uio[7]: "Unused"

# How to test the design
how_to_test: |
  1. Apply reset (rst_n = 0) for at least 5 clock cycles, then deassert (rst_n = 1).
     All LEDs (uo_out[5:0]) should be OFF.
  2. Drive a slowly-rising 6-bit value on ui_in[5:0] with ui_in[6]=0 (filter enabled).
     LEDs should light progressively: LED0 first (level>=1), LED5 last (level>=52).
  3. With the level stable around 20, suddenly jump it to 60 while ui_in[6]=0.
     The spike filter should suppress the jump — LEDs should remain at the level-20
     bar pattern for one cycle, then track normally after the transient is removed.
  4. Repeat step 3 with ui_in[6]=1 (bypass). The large jump should now pass straight
     through and all 6 LEDs should illuminate immediately.
  5. Drive ui_in[5:0] = 63 with ui_in[6]=0. All 6 LEDs should be ON.
  6. Drive ui_in[5:0] = 0.  All 6 LEDs should be OFF.

# External hardware (optional for analog front-end, not required for digital testing)
external_hw: |
  Optional analog front-end for real audio use:
    - Pre-amp (e.g., LM386) to boost microphone signal
    - Envelope detector (diode + RC low-pass, τ ~ 5-50 ms)
    - 6-bit flash ADC or comparator bank feeding ui_in[5:0]
  For digital-only testing, drive ui_in[5:0] directly from a logic source.
